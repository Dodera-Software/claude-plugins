name: pr-podcast

# On every change: the manifests validate and the example episode records on macOS, Windows and
# Linux, as it does for users. Free on a public repository; nothing here calls a model.
on:
  push:
    branches: [main]
    paths: ['plugins/pr-podcast/**', '.claude-plugin/**', '.github/workflows/pr-podcast.yml']
  pull_request:
    paths: ['plugins/pr-podcast/**', '.claude-plugin/**', '.github/workflows/pr-podcast.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugins/pr-podcast

  record:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: plugins/pr-podcast/skills/make/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the engine and the voices (first-time cost)
        run: time node record.mjs --setup
      - name: Record the example
        run: |
          node record.mjs example.json "$RUNNER_TEMP/example.mp3" | tee "$RUNNER_TEMP/result.json"
          node -e 'const r=require(process.argv[1]); if (r.seconds < 60 || r.chapters.length !== 5) { console.error("unexpected", r); process.exit(1) }' "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.os }}
          path: ${{ runner.temp }}/example.mp3
