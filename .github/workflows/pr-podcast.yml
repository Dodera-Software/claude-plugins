name: pr-podcast

# On every change: the manifests validate. Free on a public repository; nothing here calls a model.
on:
  push:
    branches: [main]
    paths: ['plugins/pr-podcast/**', '.claude-plugin/**', '.github/workflows/pr-podcast.yml']
  pull_request:
    paths: ['plugins/pr-podcast/**', '.claude-plugin/**', '.github/workflows/pr-podcast.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugins/pr-podcast

