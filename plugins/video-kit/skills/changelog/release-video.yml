# Makes a short "what's new" video for every published release, with the video-kit plugin
# (github.com/Dodera-Software/claude-plugins), and attaches it to the release.
#
# Needs one repository secret: ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
# Each run spends that key's credits. Run it by hand from the Actions tab to try it first.
name: What's new video

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      since:
        description: "Changes since (a tag like v1.4.0, or e.g. '2 weeks')"
        required: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make the video
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/Dodera-Software/claude-plugins.git
          plugins: video-kit@dodera
          prompt: /video-kit:changelog ${{ github.event.release.tag_name || inputs.since || 'since the last release' }} --ci
          claude_args: --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            video/out/whats-new-*-1080p.mp4 video/out/whats-new-*-thumbnail.jpg video/out/whats-new-*.md \
            --clobber

      - name: Keep the video as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: whats-new-video
          path: |
            video/out/whats-new-*
          if-no-files-found: warn
